<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>PWM M2 exercise 1</title>
</head>
<body>

    <h1>Registration form</h1>
    
    <form action="">
        
        <label for="firstName">Nome: </label>
        <input type="text" class="fullName" id="firstName"><br>
        <span class="checkers hidden" name="fnameCheck">Il nome deve contenere almeno due caratteri<br></span>
        
        <label for="lastName">Cognome: </label>
        <input type="text" class="fullName" name="lastName"><br>
        <span class="checkers hidden" name="lnameCheck">Il cognome deve contenere almeno due caratteri<br></span>
        
        <label for="email">e-Mail: </label>
        <input type="text" id="email"><br>
        
        <label for="pass">Password: </label>
        <input type="text" id="pass">
        
        <label for="confirmPass">Conferma password: </label>
        <input type="text" id="confirmPass"><br>
        <div class="checkers hidden" name="passCheck">
            <h4>La password deve contenere:</h4>
            <ul>
                <li>Almeno una lettera maiuscola</li>
                <li>Almeno una lettera minuscola</li>
                <li>Almeno un numero</li>
                <li>Almeno 8 caratteri</li>
            </ul>
        </div>
        
        <input type="submit" value="Invia" disabled="true">
    </form>
    
    <script src="script.js"></script>
</body>
</html>
