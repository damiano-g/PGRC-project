<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="C:\Users\damia\Documents\repos\ssri-pwm\bootstrap\css\bootstrap.min.css">
    <link rel="stylesheet" href="../myStyle.css">
    <title>Film preferiti</title>
</head>
<body id="bookmarks">

    <div class="fluidContainer header fixed-top">

        <nav>
            <ul class="nav navbar-light bg-light">
                <li class="nav-item"><a class="nav-link" href="#">Top</a></li>
                <li class="nav-item text-end"><a class="nav-link" href="../index.html">Home page</a></li>
            </ul>
        </nav>
    </div>

    <div class="fluidContainer main">
        <div class="container mb-5" id="searchArea">

            <h2 class="text-center mb-3">Film preferiti</h2>
            
            <input type="text" class="input form-control mb-1" id="searchBar" placeholder="Search film...">
            <ul class="nav mb-2 d-flex justify-content-end">
                <li class="nav-item"><button class="nav-link" id="showFilters">Mostra filtri</button></li>
                <li class="nav-item"><button class="nav-link" id="applyFilters">Applica filtri</button></li>
                <li class="nav-item"><button class="nav-link" id="resetFilters">Reset filtri</button></li>
            </ul>
            
            <form class="row d-none" id="filters">
                <div class="col-md-4">
                    <label for="yearFilter">Anno</label>
                    <input type="number" min="1900" max="2025" class="input form-control form-control-sm" id="yearFilter" placeholder="Anno">
                </div>
                <div class="col-md-4">
                    <label for="ratingFilter">Valutazione</label>
                    <select class="input form-select form-select-sm" id="ratingFilter">
                        <option value="0">-</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                        <option value="4">4+</option>
                        <option value="5">5+</option>
                        <option value="6">6+</option>
                        <option value="7">7+</option>
                        <option value="8">8+</option>
                        <option value="9">9+</option>
                    </select>
                </div>
                <div class="col-md-4 dropdown">
                    <label for="genresList">Genere</label>
                    <button class="input form-select form-select-sm text-start" data-bs-toggle="dropdown">-</button>
                    <ul class="dropdown-menu w-100"  id="genresList">
                        <!-- <li>
                            <div class="form-check">
                                <label class="form-check-label w-100"><input class="form-check-input" type="checkbox" value="">Test</label>
                            </div>
                        </li> -->
                    </ul>
                </div>
            </form>
        </div>


        <div class="row mb-4" id="showResults"></div>

        <nav id="navButtons" class="hidden fixed-bottom">
            <ul class="pagination justify-content-center">
                <li class="page-item"><a id="first" class="page-link" href="#">First</a></li>
                <li class="page-item"><a id="prev" class="page-link" href="#">Prev</a></li>
                <li class="page-item"><a id="displayPage" class="page-link disabled" href="#"></a> </li>
                <li class="page-item"><a id="next" class="page-link" href="#">Next</a></li>
                <li class="page-item"><a id="last" class="page-link" href="#">Last</a></li>
            </ul>
        </nav>
    </div>

   <script src="C:\Users\damia\Documents\repos\ssri-pwm\bootstrap\js\bootstrap.bundle.min.js"></script>
   <script src="../myScript.js"></script>
</body>
</html>
