<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <title>TMDB test</title>
</head>
<body id="index-page">
    <div class="fluid-container">
        <h2 class="mx-auto text-center px-4 py-2">Homepage</h2>
        <div class="input-group">
            <input type="text" class="form-control" id="searchBar" placeholder="Cerca la tua prossima ricetta">
            <button class="btn btn-outline-secondary" type="button" id="searchBtn">Cerca</button>
        </div>
        <div id="carousel" class="carousel slide mb-5 mt-5" data-bs-ride="carousel">
            <div class="carousel-inner"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    
        <h3 class="mx-auto text-center px-4 py-2">Categorie</h3>
        <div class="row" id="categories"></div>
    </div>

    <script type="module" src="./js/index.js"></script>
    <script src="../../../bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
