<!-- ==========================================================================
   INDEX.HTML - HOMEPAGE PGRC PROJECT

   @description
   Mostra un carousel di immagini, categorie di ricette e una navbar con ricerca globale. 
   Gestisce navigazione utente (login/logout) e collegamenti a pagine interne.

   @structure
   - Navbar: menu dropdown con link dinamici (login/logout), barra ricerca
   - Main content: carousel immagini, sezione categorie

   @dependencies
   - Bootstrap CSS/JS per layout e componenti
   - Bootstrap Icons per icone
   - recipeStyle.css per stili custom
   - index.js per logica dinamica
   ========================================================================== -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
        <link rel="stylesheet" href="./bootstrap/icons/bootstrap-icons.css">
        <link rel="stylesheet" href="./recipeStyle.css">
        <title>MypCB - Homepage</title>
    </head>

    <body id="index-page">

        <!-- ===========================
           NAVBAR PRINCIPALE
           =========================== -->
        <!-- Navbar fissa in alto: logo dropdown, ricerca globale, link dinamici per login/logout -->
        <nav class="navbar navbar-light fixed-top">
            <div class="container-fluid">
                <!-- Pulsante dropdown con logo -->
                <button class="btn btn-lg pt-0 pb-0 ps-0 pe-0" type="button" data-bs-toggle="dropdown" data-bs-target=".dropdown-menu">
                    <img  src="./assets/images/Pot_logo.png" alt="">
                </button>
                <ul class="dropdown-menu">
                    <li id="home-link">
                        <div class="dropdown-item">Homepage</div>
                        <div class="dropdown-divider"></div>
                    </li>
                    <li><span class="dropdown-item d-none" id="personal-page-link">My cookbook</span></li>
                    <li><span class="dropdown-item d-none" id="account-settings-link">Account settings</span></li>
                    <li><span class="dropdown-item d-none" id="logout-link">Logout</span></li>
                    <li><span class="dropdown-item d-none" id="login-link">Login</span></li>
                    <li><span class="dropdown-item d-none" id="signin-link">Signin</span></li>
                </ul>
                <!-- Form ricerca -->
                <form class="input-group w-50">
                    <input class="form-control" type="search" placeholder="Search" id="searchBar">
                    <button class="btn btn-sm btn-outline-dark" type="button" id="searchBtn">Search</button>
                </form>
            </div>
        </nav>

        <!-- ===========================
           CONTENUTO PRINCIPALE
           =========================== -->
        <!-- Container principale: carousel immagini e sezione categorie -->
        <div class="container-fluid">

            <!-- Carousel automatico: mostra immagini ricette con controlli prev/next -->
            <div id="carousel" class="carousel slide" data-bs-ride="carousel">
                <!-- Container slide carousel: popolato dinamicamente con slide cliccabili -->
                <div class="carousel-inner"></div>
                <!-- Pulsante precedente carousel -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <!-- Pulsante successivo carousel -->
                <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        
            <h3 class="text-center my-3">Categories</h3>
            <!-- Container categorie: popolato dinamicamente con card categorie cliccabili -->
            <div id="categories-container"></div>
        </div>

        <script type="module" src="./js/pages-scripts/index.js"></script>
        <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
