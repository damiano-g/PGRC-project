<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./bootstrap/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./recipeStyle.css">
    <title>TMDB test</title>
</head>

<body id="index-page">

    <nav class="navbar navbar-dark bg-secondary fixed-top">
        <div class="container-fluid">
            <button class="btn btn-sm" type="button" data-bs-toggle="dropdown" data-bs-target=".dropdown-menu">
                <span class="navbar-brand font-size-sm">Menu</span>
            </button>
            <ul class="dropdown-menu">
                <li id="home-link">
                    <div class="dropdown-item">Homepage</div>
                    <div class="dropdown-divider"></div>
                </li>
                <li><span class="dropdown-item d-none" id="personal-page-link">Il mio ricettario</span></li>
                <li><span class="dropdown-item d-none" id="account-settings-link">Impostazioni account</span></li>
                <li><span class="dropdown-item d-none" id="logout-link">Logout</span></li>
                <li><span class="dropdown-item d-none" id="login-link">Accedi</span></li>
                <li><span class="dropdown-item d-none" id="signin-link">Registrati</span></li>
            </ul>
            <form class="input-group w-50">
                <input class="form-control" type="search" placeholder="Search" id="searchBar">
                <button class="btn btn-sm btn-outline-light" type="button" id="searchBtn">Search</button>
            </form>
        </div>
    </nav>

    <div class="container-fluid pt-5 mt-3">
        <h2 class="mx-auto text-center px-4 py-2">Homepage</h2>
        <div id="carousel" class="carousel slide mb-5 mt-5" data-bs-ride="carousel">
            <div class="carousel-inner"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    
        <h3 class="mx-auto text-center px-4 py-2">Categorie</h3>
        <div class="row" id="categories"></div>
    </div>

    <script type="module" src="./js/pages-scripts/index.js"></script>
    <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
