<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../usersStyle.css">
    <title>Log in page</title>
</head>
<body>
    <h2>Entra</h2>

    <form class="needs-validation">
        <div class="mb-3 mt-3">
            <label class="form-label" for="username">Inserisci lo username</label>
            <input class="form-control" type="text" id="username" placeholder="Username" required>
            <div class="invalid-feedback">Il nome deve contenere almeno 2 caratteri</div>
        </div>
        <div class="mb-3 mt-3">
            <label class="form-label" for="password">Inserisci la password</label>
            <input class="form-control" type="password" id="password" placeholder="Scegli password" required>
            <div class="invalid-feedback">La password deve contenere almeno <span id="passLen">8 caratteri</span>, <span id="upCase">una lettera maiuscola</span>,
                <span id="lowCase">una lettera minuscola</span> e <span id="num">un numero</span>.
            </div>
        </div>
        <button class="brn btn-secondary mb-3 mt-3" type="button" id="gotoSign"><a href="./signin.html">Registrati</a></button>
        <button class="btn btn-secondary mb-3 mt-3" type="reset" id="clear">Pulisci campi</button>
        <button class="btn btn-primary mb-3 mt-3" type="submit" id="submit" disabled>Entra</button>
    </form>
    
    <script type="module" src="../js/pages-scripts/login.js"></script>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
