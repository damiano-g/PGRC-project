<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../usersStyle.css">
    <title>User home page</title>
</head>
<body class="d-none">
    <h1>User Home Page</h1>
    <button class="btn btn-secondary" id="logoutBtn">Logout</button>
    <button class="btn btn-secondary" id="logoutBtn"><a href="./modifUser.html">Modifica dati</a></button>
    <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#confirmPopup" id="deleteBtn">Cancella account</button>
    <div class="modal" id="confirmPopup">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-body">
                    Sei sicuro di voler rimuovere l'account?<br>L'operazione è irreversibile<br>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal" id="confirmBtn">Conferma</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="rejectBtn">Annulla</button> 
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/pages-scripts/landing.js"></script>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
