<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../bootstrap/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../recipeStyle.css">
    <title>Recipe <details></details></title>
    
</head>
<body id="recipe-page">
    
    <nav class="navbar navbar-dark bg-secondary fixed-top">
        <div class="container-fluid">
            <button class="btn btn-sm" type="button" data-bs-toggle="dropdown" data-bs-target=".dropdown-menu">
                <span class="navbar-brand font-size-sm">Menu</span>
            </button>
            <ul class="dropdown-menu">
                <li id="home-link">
                    <div class="dropdown-item">Homepage</div>
                    <div class="dropdown-divider"></div>
                </li>
                <li><span class="dropdown-item d-none" id="personal-page-link">Il mio ricettario</span></li>
                <li><span class="dropdown-item d-none" id="account-settings-link">Impostazioni account</span></li>
                <li><span class="dropdown-item d-none" id="logout-link">Logout</span></li>
                <li><span class="dropdown-item d-none" id="login-link">Accedi</span></li>
                <li><span class="dropdown-item d-none" id="signin-link">Registrati</span></li>
            </ul>
            <form class="input-group w-50">
                <input class="form-control" type="search" placeholder="Search" id="searchBar">
                <button class="btn btn-sm btn-outline-light" type="button" id="searchBtn">Search</button>
            </form>
        </div>
    </nav>

    <div class="container pt-5 mt-3">

        <h2 class="text-center">Dettaglio ricetta</h2>
        <div id="recipe-contents">
            <h1 class="text-center" id="recipe-title"></h1>
            <!-- <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#reviewDialog" id="revBtn"></button> -->
            
            <div class="modal" id="reviewDialog">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <!-- Modal Header -->
                        <div class="modal-header">
                            <h4 class="modal-title">Recensici la ricetta</h4>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <!-- Modal body -->
                        <div class="modal-body">
                            <div class="form d-none">
                                <label for="tasteRate">Gusto</label>
                                <input type="number" name="tasteRate" id="tasteRate" min="0" max="5" step="1">
                                <label for="difficultyRate">Difficoltà</label>
                                <input type="number" name="difficultyRate" id="difficultyRate" min="0" max="5" step="1">
                            </div>
                            <div class="text d-none">
                                Sei sicuro di voler rimuovere la tua recensione?<br>
                                L'operazione è irreversibile.
                            </div>
                        </div>
                        <!-- Modal footer -->
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal" disabled>Conferma</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row" id="recipe-overview"></div>
            <div class="row" id="ingredients-box">
                <h3>Ingredienti</h3>
                <ul id="ingredients-list"></ul>
            </div>
            <div class="row" id="instructions-box">
                <h3>Preparazione</h3>
                <p id="instructions-steps"></p>
            </div>
        </div>
        <div class="mb-4 mt-4 d-none" id="notes">
            <h4>Note</h4>
            <form>
                <textarea maxlength="200" name="insert-note" id="insert-note" class="form-control" placeholder="Inserisci una nota personale..."></textarea>
                <button class="btn btn-secondary" type="button" disabled>Inserisci</button>
            </form>
            <div class="mb-3 mt-3 d-none" id="user-notes"></div>
        </div>
    </div>    
    <script type="module" src="../js/pages-scripts/recipe-details.js"></script>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
