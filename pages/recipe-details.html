<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../bootstrap/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../recipeStyle.css">
    <title>Recipe <details></details></title>
    
</head>
<body>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-md">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="#" class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown">
                            Area personale
                        </a>
                        <ul class="dropdown-menu">
                            <li><a href="./login.html" class="dropdown-item">Accedi</a></li>
                            <li><a href="./signIn.html" class="dropdown-item">Registrati</a></li>
                            <li><a href="./favourites.html" class="dropdown-item">Preferiti</a></li>
                            <li><a href="./modifUser.html" class="dropdown-item">Impostazioni</a></li>
                        </ul>
                    </li>
                    <li><a href="../index.html" class="dropdown-item">Homepage</a></li>
                    </li>
                </ul>
            </div>
            <div class="input-group">
                <input type="text" class="form-control" id="searchBar" placeholder="Cerca la tua prossima ricetta">
                <button class="btn btn-outline-secondary" type="button" id="searchBtn">Cerca</button>
            </div>
        </nav>

        <h2 class="text-center">Dettaglio ricetta</h2>
        <div class="container" id="recipe-contents">
            <h1 class="text-center" id="recipe-title"></h1>
            <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#reviewDialog" id="revBtn"></button>
            
            <div class="modal" id="reviewDialog">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <!-- Modal Header -->
                        <div class="modal-header">
                            <h4 class="modal-title">Recensici la ricetta</h4>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <!-- Modal body -->
                        <div class="modal-body">
                            <div class="form d-none">
                                <label for="tasteRate">Gusto</label>
                                <input type="number" name="tasteRate" id="tasteRate" min="0" max="5" step="1">
                                <label for="difficultyRate">Difficoltà</label>
                                <input type="number" name="difficultyRate" id="difficultyRate" min="0" max="5" step="1">
                            </div>
                            <div class="text d-none">
                                Sei sicuro di voler rimuovere la tua recensione?<br>
                                L'operazione è irreversibile.
                            </div>
                        </div>
                        <!-- Modal footer -->
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal" disabled>Conferma</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row" id="">
                <div class="col position-relative" id="image-box">
                    <button class="btn btn-lg position-absolute top-0 start-0 m-4">
                        <i class="bi bi-heart" id="favBtn"></i>
                    </button>
                </div>
            </div>
            <div class="row" id="ingredients-box">
                <h3>Ingredienti</h3>
                <ul id="ingredients-list"></ul>
            </div>
            <div class="row" id="instructions-box">
                <h3>Preparazione</h3>
                <p id="instructions-steps"></p>
            </div>
        </div>
        <div class="container mb-4 mt-4 d-none" id="notes">
            <h4>Note</h4>
            <form>
                <textarea maxlength="200" name="insert-note" id="insert-note" class="form-control" placeholder="Inserisci una nota personale..."></textarea>
                <button class="btn btn-secondary" type="button" disabled>Inserisci</button>
            </form>
            <div class="mb-3 mt-3 d-none" id="user-notes"></div>
        </div>
    </div>    
    <script type="module" src="../js/pages-scripts/recipe-details.js"></script>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
