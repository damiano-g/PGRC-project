<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../recipeStyle.css">
    <title>Sign in page</title>
</head>
<body id="signin-page">
    
    <nav class="navbar navbar-light fixed-top">
        <div class="container-fluid">
            <button class="btn btn-lg pt-0 pb-0 ps-0 pe-0" type="button" data-bs-toggle="dropdown" data-bs-target=".dropdown-menu">
                <img  src="../assets/images/Pot_logo.png" alt="">
            </button>
            <ul class="dropdown-menu">
                <li id="home-link">
                    <div class="dropdown-item">Homepage</div>
                    <div class="dropdown-divider"></div>
                </li>
                <li><span class="dropdown-item d-none" id="personal-page-link">My cookbook</span></li>
                <li><span class="dropdown-item d-none" id="account-settings-link">Account settings</span></li>
                <li><span class="dropdown-item d-none" id="logout-link">Logout</span></li>
                <li><span class="dropdown-item d-none" id="login-link">Login</span></li>
                <li><span class="dropdown-item d-none" id="signin-link">Signin</span></li>
            </ul>
            <form class="input-group w-50">
                <input class="form-control" type="search" placeholder="Search" id="searchBar">
                <button class="btn btn-sm btn-outline-dark" type="button" id="searchBtn">Search</button>
            </form>
        </div>
    </nav>


    <div class="centered-content">

        <div class="container w-75">
    
            <h2>Registrati</h2>
        
            <form class="needs-validation">
                <div class="mb-3 mt-3">
                    <label class="form-label" for="username">Scegli username</label>
                    <input class="form-control" type="text" id="username" placeholder="Username" required>
                    <div class="invalid-feedback">Il nome deve contenere almeno 2 caratteri</div>
                </div>
                <div class="mb-3 mt-3">
                    <label class="form-label" for="email">Inserisci email</label>
                    <input class="form-control" type="email" id="email" placeholder="Email" required>
                    <div class="invalid-feedback">Formato non valido</div>
                </div>
                <div class="mb-3 mt-3">
                    <label class="form-label" for="password">Scegli una password</label>
                    <input class="form-control" type="password" id="password" placeholder="Scegli password" required>
                    <div class="invalid-feedback">La password deve contenere almeno <span id="passLen">8 caratteri</span>, <span id="upCase">una lettera maiuscola</span>,
                        <span id="lowCase">una lettera minuscola</span> e <span id="num">un numero</span>.
                    </div>
                </div>
                <div class="mb-3 mt-3">
                    <label class="form-label" for="confirmPassword">Conferma password</label>
                    <input class="form-control" type="password" id="confirmPassword" placeholder="Conferma password" required disabled>
                    <div class="invalid-feedback">Le password non corrispondono</div>
                </div>
                <button class="btn btn-secondary mb-3 mt-3" type="button" id="gotoLog">Vai a login</button>
                <button class="btn btn-secondary mb-3 mt-3" type="reset" id="clear">Pulisci campi</button>
                <button class="btn btn-primary mb-3 mt-3" type="submit" id="submit" disabled>Registrati</button>
            </form>
        </div>
    </div>

    <script type="module" src="../js/pages-scripts/singin.js"></script>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
